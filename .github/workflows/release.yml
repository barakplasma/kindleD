name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Version to build, e.g. v0.1.0
        required: true
        type: string

# One release run per version at a time. A dispatch that errors at the API
# but still queues its run -- which is how v0.1.0 ended up with a duplicate
# -- would otherwise race a retry, and the loser spends four minutes
# building before gh refuses to overwrite the release the winner published.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      version-code: ${{ steps.v.outputs.version_code }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.tag }}"
          else
            version="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Android needs a monotonically increasing integer. Derive it from
          # the semver so an upgrade over a previous release is accepted.
          semver="${version#v}"
          major=$(echo "$semver" | cut -d. -f1)
          minor=$(echo "$semver" | cut -d. -f2)
          patch=$(echo "$semver" | cut -d. -f3 | cut -d- -f1)
          code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          echo "version_code=${code:-1}" >> "$GITHUB_OUTPUT"
          echo "building $version (versionCode $code)"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      version-code: ${{ fromJSON(needs.version.outputs.version-code) }}
    secrets: inherit

  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name 'kindled-*' -o -name '*.apk' \) \
            -exec cp {} release/ \;
          cd release
          sha256sum -- * > SHA256SUMS
          ls -l

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes=$(cat <<'NOTES'
          Both halves of the link, built by the same workflow CI runs on
          every push.

          | Artifact | Goes on |
          | --- | --- |
          | `kindled-*-linux-armv7` | a jailbroken Kindle (32-bit userland) |
          | `kindled-*-linux-arm64` | a Kindle with a 64-bit userland |
          | `kindle-display-*-mirror-*.apk` | the Pixel — **start here** |
          | `kindle-display-*-control-*.apk` | the Pixel, once mirroring works |

          **Install the mirror build first.** It shows the phone's screen on
          the Kindle and installs like any other APK. The control build adds
          tap and scroll, which needs an accessibility service — and that
          declaration alone makes Play Protect block a sideloaded install, so
          it has to go on with `adb install` and then be unlocked under
          Settings → Apps → ⋮ → Allow restricted settings. The README has the
          steps.

          The `kindled` binaries are static and dependency-free: copy one
          onto the device and run it. See the README for install steps and
          `PROTOCOL.md` for the wire protocol.

          An APK marked `-unsigned` means no signing keystore was
          configured in repository secrets; sign it yourself with
          `apksigner` before installing, or use the `-debug` build.
          NOTES
          )
          # --target pins the tag to the commit this run built. Without it
          # gh would tag the default branch's head, which is not
          # necessarily what was just tested and packaged.
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "$notes" \
            release/*
