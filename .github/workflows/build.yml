# The one place either artifact is built.
#
# CI calls this on every push, and the release workflow calls the same
# thing on a tag, so a release is never built differently from what CI
# already proved. The only difference between the two is the version
# string that gets stamped in.
name: build

on:
  workflow_call:
    inputs:
      version:
        description: Version stamped into both artifacts (e.g. v1.2.3)
        required: false
        default: dev
        type: string
      version-code:
        description: Android versionCode; must increase between releases
        required: false
        default: 1
        type: number

jobs:
  # A malformed workflow fails the run before any job starts, which is a
  # confusing way to find out. Catch it as an ordinary check instead.
  workflows:
    name: Workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: actionlint
      # The Kindle launcher has to run under busybox ash, so check it as
      # POSIX sh rather than bash.
      - run: shellcheck -s sh scripts/*.sh

  kindle:
    name: kindled (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: kindle/go.mod
          # kindled has no dependencies, so there is no go.sum to cache from.
          cache: false

      - name: Check formatting
        working-directory: kindle
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: kindle
        run: go vet ./...

      - name: Test
        working-directory: kindle
        run: go test -race ./...

      # Static, dependency-free binaries: a Kindle only ever needs one file.
      - name: Build armv7
        working-directory: kindle
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
        run: go build -ldflags "-s -w -X main.buildVersion=${{ inputs.version }}" -o dist/kindled-${{ inputs.version }}-linux-armv7 .

      - name: Build arm64
        working-directory: kindle
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: go build -ldflags "-s -w -X main.buildVersion=${{ inputs.version }}" -o dist/kindled-${{ inputs.version }}-linux-arm64 .

      - name: Verify the binaries are what we think they are
        working-directory: kindle
        run: |
          file dist/* | tee /dev/stderr | grep -q "ARM, EABI5.*statically linked"
          file dist/* | grep -q "ARM aarch64.*statically linked"

      - uses: actions/upload-artifact@v4
        with:
          name: kindled
          path: kindle/dist/*
          if-no-files-found: error

  android:
    name: Kindle Display (Android)
    runs-on: ubuntu-latest
    env:
      KINDLED_VERSION: ${{ inputs.version }}
      KINDLED_VERSION_CODE: ${{ inputs.version-code }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      # Optional: with no keystore secret the release APK comes out
      # unsigned rather than failing the build.
      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        working-directory: android
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        working-directory: android
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -e "$apk" ] || continue
            suffix=""
            case "$apk" in *unsigned*) suffix="-unsigned" ;; esac
            cp "$apk" "dist/kindle-display-${KINDLED_VERSION}${suffix}.apk"
          done
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/kindle-display-${KINDLED_VERSION}-debug.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: kindle-display-apk
          path: android/dist/*.apk
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
